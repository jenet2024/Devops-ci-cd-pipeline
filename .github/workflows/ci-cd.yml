name: CI-CD Pipeline Ultra Complete

on:
  push:
    branches: [ "main" ]

jobs:

  # ---------------------------
  # BACKEND PIPELINE (colonne 1)
  # ---------------------------
  tests-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Tests backend"

  lint-backend:
    runs-on: ubuntu-latest
    needs: tests-backend
    steps:
      - uses: actions/checkout@v4
      - run: echo "Lint backend"

  build-backend:
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t h4ckr-backend ./backend


  # ---------------------------
  # FRONTEND PIPELINE (colonne 2)
  # ---------------------------
  tests-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Tests frontend"

  lint-frontend:
    runs-on: ubuntu-latest
    needs: tests-frontend
    steps:
      - uses: actions/checkout@v4
      - run: echo "Lint frontend"

  build-frontend:
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t h4ckr-frontend ./frontend


  # ---------------------------
  # MERGE DES DEUX PIPELINES
  # ---------------------------
  docker-compose:
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install docker-compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
      - run: docker-compose up -d --build


  # ---------------------------
  # DEPLOY
  # ---------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: docker-compose
    steps:
      - run: echo "Deploying..."
